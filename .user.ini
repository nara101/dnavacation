; Batas upload untuk video testimoni (aplikasi izinkan sampai 50MB).
; Berlaku di server PHP-FPM/FastCGI/CGI (umum di shared hosting).
; Perubahan .user.ini bisa butuh beberapa menit untuk aktif (user_ini.cache_ttl).
upload_max_filesize = 64M
post_max_size = 72M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
